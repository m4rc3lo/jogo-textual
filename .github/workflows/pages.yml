name: Publicar documentação

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar documentação
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Compilar em Release
        run: dotnet build --configuration Release --no-restore

      - name: Executar testes em Release
        run: dotnet test --configuration Release --no-build

      - name: Restaurar ferramentas locais
        run: dotnet tool restore

      - name: Gerar site com DocFX
        run: dotnet tool run docfx docfx.json

      - name: Verificar página inicial
        run: test -f _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Publicar no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar artefato
        id: deployment
        uses: actions/deploy-pages@v4
